services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kiise-vlmdb-pgvector
    environment:
      POSTGRES_DB: vlmdb
      POSTGRES_USER: vlmdb
      POSTGRES_PASSWORD: vlmdb
    ports:
      - "5433:5432"
    volumes:
      - /hdd2/KIISE_datasociety/Datasets/services/postgres_pgvector:/var/lib/postgresql/data
    restart: unless-stopped
